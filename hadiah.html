    <style>
        :root {
            --silver-light: #f8fafc;
            --silver-mid: #cbd5e1;
            --silver-accent: #94a3b8;
            --bg-obsidian: #030508;
            --card-glass: rgba(255, 255, 255, 0.03);
            --border-glow: rgba(226, 232, 240, 0.25);
            --shadow-luxury: 0 20px 50px rgba(0, 0, 0, 0.8);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg-obsidian); color: var(--silver-light); min-height: 100vh; padding-bottom: 100px; }

        .container { max-width: 480px; margin: 0 auto; padding: 30px 20px; text-align: center; }

        .luxury-card {
            background: var(--card-glass);
            backdrop-filter: blur(25px);
            border: 1px solid var(--border-glow);
            border-radius: 25px;
            padding: 30px 20px;
            box-shadow: var(--shadow-luxury);
        }

        h2 { font-family: 'Cinzel', serif; color: var(--silver-light); font-size: 1.3rem; margin-bottom: 10px; letter-spacing: 1px; }

        .contact-grid { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; }
        .contact-item { 
            background: rgba(255,255,255,0.02); 
            border: 1px solid var(--border-glow); 
            padding: 14px 18px; 
            border-radius: 14px; 
            display: flex; justify-content: space-between; align-items: center; 
            text-decoration: none; color: #fff; 
            transition: 0.3s ease; 
        }
        .contact-item:hover { background: rgba(226, 232, 240, 0.08); transform: translateY(-2px); border-color: rgba(226,232,240,0.5); }
        .contact-name { font-size: 0.85rem; font-weight: 500; text-align: left; font-family: 'Playfair Display', serif; }
        .contact-num { font-size: 0.8rem; color: #4ade80; font-weight: 600; display: flex; align-items: center; gap: 6px; }

        /* Navigation Bar */
        .navbar { position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 440px; background: rgba(10, 14, 23, 0.85); backdrop-filter: blur(25px); border: 1px solid var(--border-glow); border-radius: 40px; display: flex; justify-content: space-around; padding: 12px 10px; z-index: 100; box-shadow: 0 15px 35px rgba(0,0,0,0.9); }
        .nav-link { color: #64748b; text-decoration: none; font-size: 0.72rem; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .nav-link.active { color: var(--silver-light); font-weight: 600; text-shadow: 0 0 12px rgba(226, 232, 240, 0.8); transform: translateY(-3px); }
        .nav-link span.icon { font-size: 1.3rem; }
    </style>
</head>
