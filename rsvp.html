<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSVP | Rahmat & Sarimah</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --silver-light: #f8fafc;
            --silver-mid: #cbd5e1;
            --silver-accent: #94a3b8;
            --bg-obsidian: #030508;
            --card-glass: rgba(255, 255, 255, 0.03);
            --border-glow: rgba(226, 232, 240, 0.25);
            --shadow-luxury: 0 20px 50px rgba(0, 0, 0, 0.8);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg-obsidian); color: var(--silver-light); min-height: 100vh; padding-bottom: 100px; }

        .container { max-width: 480px; margin: 0 auto; padding: 30px 20px; }

        .luxury-card {
            background: var(--card-glass);
            backdrop-filter: blur(25px);
            border: 1px solid var(--border-glow);
            border-radius: 25px;
            padding: 30px 20px;
            box-shadow: var(--shadow-luxury);
            margin-bottom: 25px;
        }

        h2 { font-family: 'Cinzel', serif; color: var(--silver-light); font-size: 1.3rem; margin-bottom: 20px; text-align: center; letter-spacing: 1px; }

        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; font-size: 0.78rem; margin-bottom: 6px; color: var(--silver-accent); letter-spacing: 0.5px; }
        .form-control { 
            width: 100%; padding: 12px 15px; 
            background: rgba(0,0,0,0.6); 
            border: 1px solid var(--border-glow); 
            border-radius: 12px; 
            color: #fff; 
            font-family: 'Poppins', sans-serif; 
            font-size: 0.88rem; 
            transition: 0.3s;
        }
        .form-control:focus { outline: none; border-color: var(--silver-light); box-shadow: 0 0 12px rgba(226,232,240,0.3); }

        .btn-submit { 
            width: 100%; background: var(--silver-light); color: #030508; 
            border: none; padding: 12px; border-radius: 30px; 
            font-weight: 600; cursor: pointer; margin-top: 10px; 
            transition: 0.3s ease; box-shadow: 0 5px 20px rgba(255,255,255,0.2); 
        }
        .btn-submit:hover { background: #fff; transform: translateY(-2px); box-shadow: 0 8px 25px rgba(255,255,255,0.4); }

        .wishes-box { margin-top: 15px; max-height: 220px; overflow-y: auto; text-align: left; }
        .wish-item { background: rgba(255,255,255,0.02); border: 1px solid rgba(226,232,240,0.1); padding: 12px; border-radius: 10px; margin-bottom: 10px; }
        .wish-item strong { font-size: 0.82rem; color: #fff; }
        .wish-item span { font-size: 0.72rem; color: var(--silver-accent); }
        .wish-item p { font-size: 0.8rem; color: var(--silver-mid); margin-top: 4px; }

        /* Navigation Bar */
        .navbar { position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 440px; background: rgba(10, 14, 23, 0.85); backdrop-filter: blur(25px); border: 1px solid var(--border-glow); border-radius: 40px; display: flex; justify-content: space-around; padding: 12px 10px; z-index: 100; box-shadow: 0 15px 35px rgba(0,0,0,0.9); }
        .nav-link { color: #64748b; text-decoration: none; font-size: 0.72rem; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .nav-link.active { color: var(--silver-light); font-weight: 600; text-shadow: 0 0 12px rgba(226, 232, 240, 0.8); transform: translateY(-3px); }
        .nav-link span.icon { font-size: 1.3rem; }
    </style>
</head>
<body>

    <div class="container">
        <div class="luxury-card">
            <h2>Sahkan Kehadiran (RSVP)</h2>
            <form id="rsvpForm" onsubmit="handleRSVP(event)">
                <div class="form-group">
                    <label>Nama Penuh</label>
                    <input type="text" id="guestName" class="form-control" required placeholder="cth: Ahmad & Keluarga">
                </div>
                <div class="form-group">
                    <label>Status Kehadiran</label>
                    <select id="guestStatus" class="form-control">
                        <option>Hadir</option>
                        <option>Tidak Hadir</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Ucapan & Doa</label>
                    <textarea id="guestWish" class="form-control" rows="3" placeholder="Semoga majlis berjalan lancar..."></textarea>
                </div>
                <button type="submit" class="btn-submit">Hantar RSVP</button>
            </form>
        </div>

        <div class="luxury-card">
            <h2>Ucapan Tetamu</h2>
            <div class="wishes-box" id="wishesContainer">
                <div class="wish-item">
                    <strong>Fatimah & Keluarga</strong> <span>(Hadir)</span>
                    <p>Selamat pengantin baharu! Semoga kekal bahagia hingga ke jannah.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Nav Bar -->
    <nav class="navbar">
        <a href="index.html" class="nav-link"><span class="icon">✨</span>Utama</a>
        <a href="pasangan.html" class="nav-link"><span class="icon">💍</span>Pasangan</a>
        <a href="tarikh.html" class="nav-link"><span class="icon">📅</span>Atur Cara</a>
        <a href="rsvp.html" class="nav-link active"><span class="icon">💌</span>RSVP</a>
        <a href="hadiah.html" class="nav-link"><span class="icon">📞</span>Hubungi</a>
    </nav>

    <script>
        function handleRSVP(event) {
            event.preventDefault();
            const name = document.getElementById('guestName').value;
            const status = document.getElementById('guestStatus').value;
            const wish = document.getElementById('guestWish').value;

            const container = document.getElementById('wishesContainer');
            const item = document.createElement('div');
            item.className = 'wish-item';
            item.innerHTML = `<strong>${name}</strong> <span>(${status})</span><p>${wish}</p>`;
            
            container.prepend(item);
            alert('Terima kasih! RSVP dan ucapan anda telah berjaya dihantar.');
            document.getElementById('rsvpForm').reset();
        }
    </script>
</body>
</html>
