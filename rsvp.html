<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSVP | Rahmat & Sarimah</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --silver-primary: #e2e8f0;
            --silver-accent: #94a3b8;
            --bg-dark: #090a0f;
            --card-bg: rgba(255, 255, 255, 0.04);
            --border-silver: rgba(226, 232, 240, 0.2);
            --text-main: #f8fafc;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg-dark); color: var(--text-main); min-height: 100vh; padding-bottom: 95px; }

        .container { max-width: 480px; margin: 0 auto; padding: 30px 20px; }

        .glass-card { background: var(--card-bg); backdrop-filter: blur(18px); border: 1px solid var(--border-silver); border-radius: 20px; padding: 30px 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.5); }

        h2 { font-family: 'Playfair Display', serif; color: var(--silver-primary); font-size: 1.6rem; margin-bottom: 15px; text-align: center; }

        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; font-size: 0.8rem; margin-bottom: 5px; color: var(--silver-accent); }
        .form-control { width: 100%; padding: 12px; background: rgba(0,0,0,0.5); border: 1px solid var(--border-silver); border-radius: 10px; color: #fff; font-family: 'Poppins', sans-serif; font-size: 0.88rem; }

        .btn-submit { width: 100%; background: var(--silver-primary); color: #0f172a; border: none; padding: 12px; border-radius: 25px; font-weight: 600; cursor: pointer; margin-top: 10px; }

        /* Floating Nav Bar */
        .navbar { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 440px; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(20px); border: 1px solid var(--border-silver); border-radius: 30px; display: flex; justify-content: space-around; padding: 12px 10px; z-index: 100; }
        .nav-link { color: #64748b; text-decoration: none; font-size: 0.72rem; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .nav-link.active { color: var(--silver-primary); font-weight: 600; }
        .nav-link span.icon { font-size: 1.2rem; }
    </style>
</head>
<body>

    <div class="container">
        <div class="glass-card">
            <h2>Sahkan Kehadiran (RSVP)</h2>
            <form onsubmit="event.preventDefault(); alert('Terima kasih! RSVP anda telah berjaya dihantar.');">
                <div class="form-group">
                    <label>Nama Penuh</label>
                    <input type="text" class="form-control" required placeholder="cth: Ahmad & Keluarga">
                </div>
                <div class="form-group">
                    <label>Status Kehadiran</label>
                    <select class="form-control">
                        <option>Hadir</option>
                        <option>Tidak Hadir</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Ucapan & Doa</label>
                    <textarea class="form-control" rows="3" placeholder="Semoga majlis berjalan lancar..."></textarea>
                </div>
                <button type="submit" class="btn-submit">Hantar RSVP</button>
            </form>
        </div>
    </div>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <a href="index.html" class="nav-link"><span class="icon">🏠</span>Utama</a>
        <a href="pasangan.html" class="nav-link"><span class="icon">💍</span>Pasangan</a>
        <a href="tarikh.html" class="nav-link"><span class="icon">📅</span>Atur Cara</a>
        <a href="rsvp.html" class="nav-link active"><span class="icon">💌</span>RSVP</a>
        <a href="hadiah.html" class="nav-link"><span class="icon">📞</span>Hubungi</a>
    </nav>

</body>
</html>
