<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atur Cara & Lokasi | Rahmat & Sarimah</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --silver-light: #f8fafc;
            --silver-mid: #cbd5e1;
            --silver-accent: #94a3b8;
            --bg-obsidian: #030508;
            --card-glass: rgba(255, 255, 255, 0.03);
            --border-glow: rgba(226, 232, 240, 0.25);
            --shadow-luxury: 0 20px 50px rgba(0, 0, 0, 0.8);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg-obsidian); color: var(--silver-light); min-height: 100vh; padding-bottom: 100px; }

        .container { max-width: 480px; margin: 0 auto; padding: 30px 20px; text-align: center; }

        .luxury-card {
            background: var(--card-glass);
            backdrop-filter: blur(25px);
            border: 1px solid var(--border-glow);
            border-radius: 25px;
            padding: 30px 20px;
            box-shadow: var(--shadow-luxury);
            margin-bottom: 25px;
        }

        h2 { font-family: 'Cinzel', serif; color: var(--silver-light); font-size: 1.3rem; margin-bottom: 15px; letter-spacing: 1px; }

        .countdown { display: flex; justify-content: center; gap: 10px; margin: 20px 0; }
        .time-box { background: rgba(226, 232, 240, 0.06); border: 1px solid var(--border-glow); padding: 10px; border-radius: 12px; min-width: 65px; backdrop-filter: blur(10px); }
        .time-box span { display: block; font-family: 'Cinzel', serif; font-size: 1.2rem; font-weight: 700; color: #fff; text-shadow: 0 0 10px rgba(226,232,240,0.5); }
        .time-box label { font-size: 0.6rem; text-transform: uppercase; color: var(--silver-accent); letter-spacing: 1px; }

        .btn { display: inline-block; background: var(--silver-light); color: #030508; padding: 11px 22px; border-radius: 30px; text-decoration: none; font-size: 0.82rem; font-weight: 600; margin: 6px; transition: 0.3s ease; box-shadow: 0 5px 20px rgba(255,255,255,0.2); }
        .btn:hover { transform: translateY(-2px); background: #fff; box-shadow: 0 8px 25px rgba(255,255,255,0.4); }
        .btn.secondary { background: transparent; border: 1px solid var(--silver-light); color: var(--silver-light); box-shadow: none; }
        .btn.secondary:hover { background: rgba(255,255,255,0.08); }

        /* Navigation Bar */
        .navbar { position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 440px; background: rgba(10, 14, 23, 0.85); backdrop-filter: blur(25px); border: 1px solid var(--border-glow); border-radius: 40px; display: flex; justify-content: space-around; padding: 12px 10px; z-index: 100; box-shadow: 0 15px 35px rgba(0,0,0,0.9); }
        .nav-link { color: #64748b; text-decoration: none; font-size: 0.72rem; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .nav-link.active { color: var(--silver-light); font-weight: 600; text-shadow: 0 0 12px rgba(226, 232, 240, 0.8); transform: translateY(-3px); }
        .nav-link span.icon { font-size: 1.3rem; }
    </style>
</head>
<body>

    <div class="container">
        <div class="luxury-card">
            <h2>Tarikh & Masa</h2>
            <p style="font-size: 1.05rem; font-weight: 600; color: #fff; font-family: 'Playfair Display', serif;">AHAD, 01 NOV 2026</p>
            <p style="font-size: 0.82rem; color: var(--silver-accent); margin-top: 8px;">Atur Acara Majlis: 11:00 AM - 4:00 PM</p>

            <div class="countdown">
                <div class="time-box"><span id="days">00</span><label>Hari</label></div>
                <div class="time-box"><span id="hours">00</span><label>Jam</label></div>
                <div class="time-box"><span id="minutes">00</span><label>Minit</label></div>
                <div class="time-box"><span id="seconds">00</span><label>Saat</label></div>
            </div>
        </div>

        <div class="luxury-card">
            <h2>Lokasi Majlis</h2>
            <p style="font-size: 0.88rem; font-weight: 500; line-height: 1.7; color: var(--silver-mid); margin-bottom: 20px;">
                LOT 91 JLN LABU 8<br>
                (LORONG RAHMAT)<br>
                BATU 10 LABU, SEREMBAN N9
            </p>
            <div>
                <a href="https://maps.google.com/?q=LOT+91+JLN+LABU+8+BATU+10+LABU+SEREMBAN" target="_blank" class="btn">📍 Google Maps</a>
                <a href="https://waze.com/ul?q=BATU+10+LABU+SEREMBAN" target="_blank" class="btn secondary">🚗 Waze</a>
            </div>
        </div>
    </div>

    <!-- Nav Bar -->
    <nav class="navbar">
        <a href="index.html" class="nav-link"><span class="icon">✨</span>Utama</a>
        <a href="pasangan.html" class="nav-link"><span class="icon">💍</span>Pasangan</a>
        <a href="tarikh.html" class="nav-link active"><span class="icon">📅</span>Atur Cara</a>
        <a href="rsvp.html" class="nav-link"><span class="icon">💌</span>RSVP</a>
        <a href="hadiah.html" class="nav-link"><span class="icon">📞</span>Hubungi</a>
    </nav>

    <script>
        const weddingDate = new Date("Nov 1, 2026 11:00:00").getTime();
        setInterval(() => {
            const now = new Date().getTime();
            const distance = weddingDate - now;

            document.getElementById("days").innerText = Math.floor(distance / (1000 * 60 * 60 * 24));
            document.getElementById("hours").innerText = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            document.getElementById("minutes").innerText = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            document.getElementById("seconds").innerText = Math.floor((distance % (1000 * 60)) / 1000);
        }, 1000);
    </script>
</body>
</html>
