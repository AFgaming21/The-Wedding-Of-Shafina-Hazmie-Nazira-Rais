<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Walimatulurus | Rahmat & Sarimah</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --silver-light: #f8fafc;
            --silver-mid: #cbd5e1;
            --silver-accent: #94a3b8;
            --bg-obsidian: #030508;
            --card-glass: rgba(255, 255, 255, 0.03);
            --border-glow: rgba(226, 232, 240, 0.25);
            --shadow-luxury: 0 20px 50px rgba(0, 0, 0, 0.8), inset 0 0 25px rgba(226, 232, 240, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg-obsidian); color: var(--silver-light); overflow-x: hidden; min-height: 100vh; padding-bottom: 100px; }

        canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }

        .container { max-width: 480px; margin: 0 auto; min-height: 100vh; position: relative; z-index: 2; padding: 40px 20px; text-align: center; display: flex; flex-direction: column; justify-content: center; }

        .luxury-card {
            background: var(--card-glass);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border-glow);
            border-radius: 30px;
            padding: 45px 25px;
            box-shadow: var(--shadow-luxury);
            position: relative;
            animation: cardEntrance 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes cardEntrance {
            from { opacity: 0; transform: translateY(40px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .bismillah { font-family: 'Cinzel', serif; font-size: 2rem; color: var(--silver-mid); margin-bottom: 20px; text-shadow: 0 0 15px rgba(226,232,240,0.5); }
        .subtitle { font-size: 0.75rem; letter-spacing: 6px; text-transform: uppercase; color: var(--silver-accent); margin-bottom: 20px; font-weight: 500; }

        h1 { 
            font-family: 'Playfair Display', serif; 
            font-size: 2.8rem; 
            background: linear-gradient(135deg, #ffffff 20%, #cbd5e1 60%, #64748b 100%);
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            margin: 10px 0;
            font-weight: 700;
        }

        .ampersand { font-family: 'Playfair Display', serif; font-style: italic; font-size: 1.6rem; color: var(--silver-accent); display: block; margin: 5px 0; }

        .divider { width: 60px; height: 1px; background: var(--border-glow); margin: 25px auto; }

        .desc { font-size: 0.9rem; line-height: 1.9; color: var(--silver-mid); }

        /* Floating Audio Control */
        .music-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(10, 14, 23, 0.8);
            border: 1px solid var(--border-glow);
            color: var(--silver-light);
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 1000;
            backdrop-filter: blur(10px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            font-size: 1.2rem;
            transition: 0.3s ease;
        }
        .music-btn:hover { transform: scale(1.1); border-color: var(--silver-light); }

        /* Floating Luxury Navigation Bar */
        .navbar { 
            position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%); 
            width: 92%; max-width: 440px; 
            background: rgba(10, 14, 23, 0.85); 
            backdrop-filter: blur(25px); 
            border: 1px solid var(--border-glow); 
            border-radius: 40px; 
            display: flex; justify-content: space-around; 
            padding: 12px 10px; z-index: 100; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.9); 
        }
        .nav-link { color: #64748b; text-decoration: none; font-size: 0.72rem; display: flex; flex-direction: column; align-items: center; gap: 4px; transition: 0.3s ease; }
        .nav-link.active { color: var(--silver-light); font-weight: 600; text-shadow: 0 0 12px rgba(226, 232, 240, 0.8); transform: translateY(-3px); }
        .nav-link span.icon { font-size: 1.3rem; }
    </style>
</head>
<body onclick="playMusicOnFirstClick()">

    <!-- Memanggil Fail Lagu Tempatan -->
    <audio id="bgMusic" loop>
        <source src="lagu.mp3" type="audio/mpeg">
    </audio>

    <!-- Butang Kawalan Muzik -->
    <button class="music-btn" id="musicToggle" onclick="toggleMusic(event)" title="Main/Henti Muzik">🎵</button>

    <canvas id="diamondDust"></canvas>

    <div class="container">
        <div class="luxury-card">
            <div class="bismillah">﷽</div>
            <p class="subtitle">Undangan Walimatulurus</p>
            <h1>Rahmat</h1>
            <span class="ampersand">&</span>
            <h1>Sarimah</h1>
            <div class="divider"></div>
            <p class="desc">
                Dengan penuh rasa kesyukuran, kami menjemput Dato' / Datin / Tuan / Puan / Encik / Cik sekeluarga ke majlis perkahwinan puteri & putera kami[cite: 1].
            </p>
        </div>
    </div>

    <!-- Nav Bar -->
    <nav class="navbar">
        <a href="index.html" class="nav-link active"><span class="icon">✨</span>Utama</a>
        <a href="pasangan.html" class="nav-link"><span class="icon">💍</span>Pasangan</a>
        <a href="tarikh.html" class="nav-link"><span class="icon">📅</span>Atur Cara</a>
        <a href="rsvp.html" class="nav-link"><span class="icon">💌</span>RSVP</a>
        <a href="hadiah.html" class="nav-link"><span class="icon">📞</span>Hubungi</a>
    </nav>

    <script>
        const music = document.getElementById('bgMusic');
        const btn = document.getElementById('musicToggle');
        let hasPlayed = false;

        function playMusicOnFirstClick() {
            if (!hasPlayed) {
                music.play().then(() => {
                    btn.innerHTML = "🎵";
                    hasPlayed = true;
                }).catch(() => {});
            }
        }

        function toggleMusic(e) {
            e.stopPropagation();
            if (music.paused) {
                music.play();
                btn.innerHTML = "🎵";
            } else {
                music.pause();
                btn.innerHTML = "🔇";
            }
        }

        const canvas = document.getElementById('diamondDust');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const particles = Array.from({ length: 60 }, () => ({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            r: Math.random() * 2 + 0.5,
            d: Math.random() * 0.6 + 0.2,
            alpha: Math.random()
        }));

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                ctx.fillStyle = `rgba(226, 232, 240, ${p.alpha})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fill();
                p.y -= p.d;
                p.alpha += (Math.random() * 0.02 - 0.01);
                if (p.y < 0) p.y = canvas.height;
                if (p.alpha < 0.1) p.alpha = 0.1;
                if (p.alpha > 1) p.alpha = 1;
            });
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
