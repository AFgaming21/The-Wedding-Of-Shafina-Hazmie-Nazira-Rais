<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Walimatulurus | Rahmat & Sarimah</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --silver-primary: #e2e8f0;
            --silver-accent: #94a3b8;
            --silver-glow: rgba(226, 232, 240, 0.25);
            --bg-dark: #090a0f;
            --card-bg: rgba(255, 255, 255, 0.04);
            --border-silver: rgba(226, 232, 240, 0.2);
            --text-main: #f8fafc;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg-dark); color: var(--text-main); overflow-x: hidden; min-height: 100vh; padding-bottom: 95px; }

        canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }

        .container { max-width: 480px; margin: 0 auto; min-height: 100vh; position: relative; z-index: 2; padding: 40px 20px; text-align: center; display: flex; flex-direction: column; justify-content: center; }

        .glass-card { background: var(--card-bg); backdrop-filter: blur(18px); border: 1px solid var(--border-silver); border-radius: 24px; padding: 40px 25px; box-shadow: 0 20px 40px rgba(0,0,0,0.6), inset 0 0 20px var(--silver-glow); animation: fadeIn 1.2s ease forwards; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .bismillah { font-size: 1.8rem; color: var(--silver-primary); margin-bottom: 15px; text-shadow: 0 0 10px rgba(226, 232, 240, 0.4); }
        .subtitle { font-size: 0.75rem; letter-spacing: 5px; text-transform: uppercase; color: var(--silver-accent); margin-bottom: 15px; }

        h1 { font-family: 'Playfair Display', serif; font-size: 2.4rem; background: linear-gradient(135deg, #ffffff 0%, #94a3b8 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 15px 0; }
        
        .desc { font-size: 0.88rem; line-height: 1.8; color: #cbd5e1; margin-top: 20px; }

        /* Floating Navigation Bar */
        .navbar { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 440px; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(20px); border: 1px solid var(--border-silver); border-radius: 30px; display: flex; justify-content: space-around; padding: 12px 10px; z-index: 100; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .nav-link { color: #64748b; text-decoration: none; font-size: 0.72rem; display: flex; flex-direction: column; align-items: center; gap: 4px; transition: 0.3s; }
        .nav-link.active { color: var(--silver-primary); font-weight: 600; text-shadow: 0 0 10px rgba(226, 232, 240, 0.6); }
        .nav-link span.icon { font-size: 1.2rem; }
    </style>
</head>
<body>

    <canvas id="silverParticles"></canvas>

    <div class="container">
        <div class="glass-card">
            <div class="bismillah">﷽</div>
            <p class="subtitle">Undangan Walimatulurus</p>
            <h1>Rahmat & Sarimah</h1>
            <p class="desc">
                Dengan penuh rasa kesyukuran, kami menjemput Tuan/Puan sekeluarga ke majlis perkahwinan puteri & putera kami. Sila gunakan menu di bawah untuk maklumat lanjut.
            </p>
        </div>
    </div>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <a href="index.html" class="nav-link active"><span class="icon">🏠</span>Utama</a>
        <a href="pasangan.html" class="nav-link"><span class="icon">💍</span>Pasangan</a>
        <a href="tarikh.html" class="nav-link"><span class="icon">📅</span>Atur Cara</a>
        <a href="rsvp.html" class="nav-link"><span class="icon">💌</span>RSVP</a>
        <a href="hadiah.html" class="nav-link"><span class="icon">📞</span>Hubungi</a>
    </nav>

    <script>
        const canvas = document.getElementById('silverParticles');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const particles = Array.from({ length: 45 }, () => ({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            r: Math.random() * 2.5 + 0.8,
            d: Math.random() * 0.8 + 0.3
        }));

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "rgba(226, 232, 240, 0.5)";
            particles.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fill();
                p.y -= p.d;
                if (p.y < 0) p.y = canvas.height;
            });
            requestAnimationFrame(draw);
        }
        draw();
    </script>
</body>
</html>
